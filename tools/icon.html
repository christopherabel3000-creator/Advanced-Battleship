<!doctype html>
<!-- Salvo Command's app icon and launch image. tools/icon.py saves them as PNG files. -->
<html><head><meta charset="utf-8"><style>
html,body{margin:0;background:#06192a}
svg{display:block}
</style></head><body>
<script>
const splash = location.search.includes('splash');
const N = splash ? 2732 : 1024;
// The icon art is drawn on a 1024 square; the launch image puts it, smaller, in the middle of a plain background.
const art = `
  <defs>
    <radialGradient id="sea" cx="50%" cy="45%" r="70%">
      <stop offset="0" stop-color="#0f4a6e"/><stop offset="1" stop-color="#06192a"/>
    </radialGradient>
    <radialGradient id="burst" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff3c4"/><stop offset="0.35" stop-color="#ffb23f"/><stop offset="1" stop-color="#e2461f"/>
    </radialGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7cf2b0" stop-opacity="0"/><stop offset="1" stop-color="#7cf2b0" stop-opacity="0.55"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#sea)"/>
  <g fill="none" stroke="#7cf2b0" stroke-opacity="0.55">
    <circle cx="512" cy="512" r="400" stroke-width="14"/>
    <circle cx="512" cy="512" r="290" stroke-width="8"/>
    <circle cx="512" cy="512" r="180" stroke-width="8"/>
    <line x1="112" y1="512" x2="912" y2="512" stroke-width="6"/>
    <line x1="512" y1="112" x2="512" y2="912" stroke-width="6"/>
  </g>
  <path d="M512 512 L912 512 A400 400 0 0 0 795 229 Z" fill="url(#sweep)"/>
  <g>
    <circle cx="640" cy="360" r="92" fill="url(#burst)"/>
    <circle cx="800" cy="540" r="62" fill="url(#burst)"/>
    <circle cx="430" cy="210" r="52" fill="url(#burst)"/>
  </g>
  <g fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round">
    <circle cx="640" cy="360" r="132"/>
    <line x1="640" y1="196" x2="640" y2="250"/><line x1="640" y1="470" x2="640" y2="524"/>
    <line x1="476" y1="360" x2="530" y2="360"/><line x1="750" y1="360" x2="804" y2="360"/>
  </g>`;
const scale = splash ? 0.42 : 1, off = (N - 1024 * scale) / 2;
document.body.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="${N}" height="${N}" viewBox="0 0 ${N} ${N}">
  <rect width="${N}" height="${N}" fill="#08243a"/>
  ${splash ? `<g transform="translate(${off} ${off}) scale(${scale})"><clipPath id="r"><rect width="1024" height="1024" rx="226"/></clipPath><g clip-path="url(#r)">${art}</g></g>` : art}
</svg>`;
</script>
</body></html>
